{% extends "base.html" %}
{% block title %}Новый пользователь{% endblock %}
{% block content %}
<h2>Новый администратор</h2>
<article style="max-width: 560px;">
<form method="post">{% csrf_token %}
  {{ form.non_field_errors }}
  {% for f in form %}
    <label>{{ f.label }} {{ f }}{% for e in f.errors %}<small class="error">{{ e }}</small>{% endfor %}</label>
  {% endfor %}
  <button type="submit">Создать</button>
</form>
</article>
<p><a href="{% url 'accounts:settings' %}#users">← Настройки</a></p>
{% endblock %}
