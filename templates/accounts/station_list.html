{% extends "base.html" %}
{% block title %}Точки{% endblock %}
{% block content %}
<h2>Точки</h2>
<table>
  <thead><tr><th>Название</th><th>Организация</th><th>Город</th></tr></thead>
  <tbody>
  {% for s in stations %}
    <tr><td><a href="{% url 'accounts:station_detail' s.pk %}">{{ s.name }}</a></td><td>{{ s.organization.name }}</td><td>{{ s.city }}</td></tr>
  {% empty %}
    <tr><td colspan="3" class="muted">Нет доступных точек.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
