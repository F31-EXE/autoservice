{% if page.paginator.num_pages > 1 %}
<nav class="pagination">
  {% if page.has_previous %}<a href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page.previous_page_number }}">← Назад</a>{% endif %}
  <span>Стр. {{ page.number }} из {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page.next_page_number }}">Вперёд →</a>{% endif %}
</nav>
{% endif %}
